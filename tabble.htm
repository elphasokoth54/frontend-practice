<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="table.css">
    <title>My table</title>
</head>

            <tr>
                <th>Rank</th>
                <th>Team</th>
                <th>Score</th>

            </tr>
            <tr>
                <td>2</td>

            </tr>
            <tr>
                <td>3</td>

            </tr>
        </tbody>
    </table>
    
</body>
</html>
