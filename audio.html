<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with the HTML Audio Element</title>
    <style>

        * {
            padding: 0;
            margin: 0;
        }
        
        h1 {
            text-align: center;
            color: blue;
            margin-bottom: 3rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            
        }

        body {
            color: white;
            background-color: black;
            width: 700px;
        }

    </style>
</head>

<body>
    <h1>freeCodeCamp Tunes</h1>
    <div class="grid">
        
        <div>
            <h2>Can't Stay Down</h2>
            <p>Artist: Quincy Larson</p>
        </div>
        
        <div>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3" loop controls></audio>
        </div>
        
        
        <div>
            <h2>Cruising for a Musing</h2>
            <p>Artist: Quincy Larson</p>
        </div>
        
        <div>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" loop
                controls></audio>
        </div>

    </div>
    

    
        



</body>

</html>
